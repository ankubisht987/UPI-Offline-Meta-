spring.application.name=upi-offline-meta

# Server
server.port=1010

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/upi_meta?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=update    
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.ankush=INFO
logging.level.com.ankush.upi_offline_meta=DEBUG

# Custom properties
upi.mesh.packet-max-age-seconds=86400