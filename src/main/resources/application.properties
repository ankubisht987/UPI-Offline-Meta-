spring.application.name=${SPRING_APPLICATION_NAME:upi-offline-meta}

# Server
server.port=${SERVER_PORT:1000}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

# Logging
logging.level.com.ankush=${LOGGING_LEVEL_COM_ANKUSH:INFO}
logging.level.com.ankush.upi_offline_meta=${LOGGING_LEVEL_COM_ANKUSH_UPI_OFFLINE_META:INFO}

# Custom properties
upi.mesh.packet-max-age-seconds=${UPI_MESH_PACKET_MAX_AGE_SECONDS:86400}


spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

